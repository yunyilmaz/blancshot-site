<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlancShot</title>
<style>
:root{--bg:#FAF7F2;--surface:#FFFFFF;--ink:#1C1B1A;--muted:#5E5A54;--accent:#1F6F5C;--line:#EFEAE2}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--surface:#22201D;--ink:#F3EFE9;--muted:#ADA69C;--accent:#8FD0BB;--line:#2E2B27}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 20px}
h1{font-size:40px;margin:0 0 8px;letter-spacing:-.5px}p{color:var(--muted)}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 22px;margin:12px 0;color:var(--ink);text-decoration:none;font-weight:600}
a.card:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>BlancShot</h1>
<p>Listing photos for Etsy and Shopify sellers: a guided shot list, clean cut-outs on your iPhone, and your originals always kept.</p>
<a class="card" href="privacy.html">Privacy policy →</a>
<a class="card" href="support.html">Support →</a>
<p><small>Etsy and Shopify are trademarks of their respective owners. BlancShot isn't affiliated with or endorsed by them.</small></p>
</main>
</body>
</html>
